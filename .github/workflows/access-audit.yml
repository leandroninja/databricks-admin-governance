name: Auditoria de Acessos — Semanal

on:
  schedule:
    # Toda segunda-feira às 08h BRT (11h UTC)
    - cron: "0 11 * * 1"
  workflow_dispatch:
    inputs:
      catalog:
        description: "Catálogo para auditoria (padrão: prod)"
        required: false
        default: "prod"
      period_days:
        description: "Período de análise em dias"
        required: false
        default: "7"

permissions:
  contents: read
  issues: write
  security-events: write

jobs:
  auditoria-de-acessos:
    name: Auditoria Completa de Acessos
    runs-on: ubuntu-latest
    environment: producao

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Autenticar no Azure (OIDC)
        uses: azure/login@v2
        with:
          client-id:       ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id:       ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Rotação de tokens que estão para expirar
      - name: Verificar tokens prestes a expirar
        env:
          DATABRICKS_HOST:  ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: |
          python3 -c "
          from src.admin.service_principal_manager import ServicePrincipalManager
          mgr = ServicePrincipalManager()
          expiring = mgr.rotate_expiring_tokens(days_before_expiry=7)
          print(f'Tokens para rotação: {len(expiring)}')
          for t in expiring:
              print(f'  - {t[\"comment\"]} (criado por: {t[\"created_by\"]}, expira: {t[\"expires_at\"]})')
          " | tee token-report.txt

      # Auditoria de acessos efetivos
      - name: Executar auditoria de usuários
        env:
          DATABRICKS_HOST:  ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: |
          python3 -c "
          from src.admin.access_auditor import AccessAuditor
          auditor = AccessAuditor()
          report = auditor.export_for_review()
          with open('access-review.json', 'w') as f:
              f.write(report)
          import json
          data = json.loads(report)
          print(f'Usuários ativos: {data[\"summary\"][\"total_active_users\"]}')
          print(f'Admins: {data[\"summary\"][\"admin_users\"]}')
          print(f'Contas órfãs: {data[\"summary\"][\"orphaned_accounts\"]}')
          print(f'Over-privileged: {data[\"summary\"][\"over_privileged\"]}')
          "

      # Verificações de compliance
      - name: Gerar relatório de conformidade
        env:
          DATABRICKS_HOST:  ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: |
          python3 -c "
          from src.security.compliance_reporter import ComplianceReporter
          reporter = ComplianceReporter()
          report = reporter.generate_report(
              catalog_name='${{ github.event.inputs.catalog || 'prod' }}',
              period_days=${{ github.event.inputs.period_days || 7 }},
              output_path='compliance-report.json'
          )
          print(f'Score de conformidade: {report.compliance_score}%')
          print(f'Verificações: {report.pass_count} pass, {report.fail_count} fail')
          for check in report.checks:
              if check.status == 'FAIL':
                  print(f'  ❌ [{check.check_id}] {check.title}')
                  print(f'     → {check.remediation}')
          "

      # Auditoria de clusters fora de compliance
      - name: Auditar compliance de clusters
        env:
          DATABRICKS_HOST:  ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: |
          python3 -c "
          from src.cluster.cluster_policy_manager import ClusterPolicyManager
          mgr = ClusterPolicyManager()
          results = mgr.audit_all_clusters()
          non_compliant = [r for r in results if not r.is_compliant]
          print(f'Clusters: {len(results)} total, {len(non_compliant)} fora de compliance')
          for cluster in non_compliant:
              print(f'  ❌ {cluster.cluster_name} (proprietário: {cluster.owner})')
              for issue in cluster.issues:
                  print(f'     → {issue}')
          "

      - name: Upload relatórios como artefato
        uses: actions/upload-artifact@v4
        with:
          name: relatorios-auditoria-${{ github.run_number }}
          path: |
            token-report.txt
            access-review.json
            compliance-report.json
          retention-days: 90

      # Abrir issue se houver problemas críticos
      - name: Criar issue para problemas críticos
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            let report = {};
            try {
              report = JSON.parse(fs.readFileSync('compliance-report.json', 'utf8'));
            } catch(e) { return; }

            const score = report.metadata?.compliance_score || '0%';
            const fails = report.checks?.filter(c => c.status === 'FAIL') || [];

            if (fails.length > 0) {
              const failList = fails.map(f =>
                `- ❌ [${f.check_id}] **${f.title}**\n  → ${f.remediation || 'Verificar manualmente'}`
              ).join('\n');

              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `🔒 Auditoria de Segurança Databricks — ${fails.length} falha(s) detectada(s)`,
                body: `## Relatório de Conformidade Databricks\n\n` +
                  `**Score:** ${score} | **Data:** ${new Date().toISOString().split('T')[0]}\n\n` +
                  `### Verificações com Falha\n\n${failList}\n\n` +
                  `**Artefatos:** [Ver relatório completo](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})\n\n` +
                  `/cc @leandroninja`,
                labels: ['segurança', 'databricks', 'auditoria', 'priority:high'],
              });
            }

  rotacao-semanal-tokens:
    name: Rotação de Tokens de Service Principals
    runs-on: ubuntu-latest
    environment: producao
    needs: [auditoria-de-acessos]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - run: pip install -r requirements.txt

      - name: Executar script de rotação de tokens
        env:
          DATABRICKS_HOST:           ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN:          ${{ secrets.DATABRICKS_TOKEN }}
          DAYS_BEFORE_EXPIRY:        "7"
          SLACK_WEBHOOK_URL:         ${{ secrets.SLACK_WEBHOOK_URL }}
        run: bash scripts/rotate-tokens.sh
